name: UnalomePocket

options:
  bundleIdPrefix: ai.unalome
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  PocketKit:
    path: Packages/PocketKit

targets:
  UnalomePocket:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
      # App Intents and the Live Activity attributes, compiled into the app and the widgets.
      - path: Shared
    dependencies:
      - target: UnalomePocketWidgets
        destinationFilters: [iOS]
      - package: PocketKit
        product: PocketShared
      - package: PocketKit
        product: Features
      - package: PocketKit
        product: ChatCore
      - package: PocketKit
        product: ModelCatalog
      - package: PocketKit
        product: MLXEngine
      - package: PocketKit
        product: AppleEngine
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        # The increased-memory-limit entitlement exists only on iOS.
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: App/UnalomePocket-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: App/UnalomePocket-iOS.entitlements
        # Hardened runtime on macOS needs this to use the microphone for dictation.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/UnalomePocket-macOS.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: ai.unalome.pocket
        PRODUCT_NAME: UnalomePocket
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Unalome Pocket
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: true
        NSCameraUsageDescription: Take a photo to ask the model about. The photo stays on this device.
        NSPhotoLibraryUsageDescription: Choose a photo to ask the model about. It stays on this device.
        NSMicrophoneUsageDescription: Dictate messages. Speech is turned into text on this device and is never sent anywhere.
        NSSpeechRecognitionUsageDescription: Dictate messages with on-device speech recognition. Nothing is sent to a server.
        UIUserInterfaceStyle: Dark
        # unalomepocket://new, /voice, /ask?q=…, /conversation/<id>: widgets and Shortcuts.
        CFBundleURLTypes:
          - CFBundleURLName: ai.unalome.pocket
            CFBundleURLSchemes: [unalomepocket]
        # Model downloads on the Lock Screen and in the Dynamic Island.
        NSSupportsLiveActivities: true
        # One continued-processing task per model download, so it keeps going in the background.
        BGTaskSchedulerPermittedIdentifiers:
          - ai.unalome.pocket.download.*
        UIApplicationSceneManifest:
          # One window: two windows on one conversation would stream two replies into it.
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  UnalomePocketWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    dependencies:
      - package: PocketKit
        product: PocketShared
      - package: PocketKit
        product: UnalomeDesign
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Widgets/UnalomePocketWidgets.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: ai.unalome.pocket.widgets
        PRODUCT_NAME: UnalomePocketWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Unalome Pocket
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
