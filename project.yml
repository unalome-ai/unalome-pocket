name: UnalomePocket

options:
  bundleIdPrefix: ai.unalome
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  PocketKit:
    path: Packages/PocketKit

targets:
  UnalomePocket:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    dependencies:
      - package: PocketKit
        product: Features
      - package: PocketKit
        product: ChatCore
      - package: PocketKit
        product: ModelCatalog
      - package: PocketKit
        product: MLXEngine
      - package: PocketKit
        product: AppleEngine
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        # The increased-memory-limit entitlement exists only on iOS; macOS gets no entitlements yet.
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: App/UnalomePocket-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: App/UnalomePocket-iOS.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: ai.unalome.pocket
        PRODUCT_NAME: UnalomePocket
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Unalome Pocket
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          # One window: two windows on one conversation would stream two replies into it.
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
